workflows:
  android-apk-classic-build:
    name: Android APK Classic Build
    max_build_duration: 7
    instance_type: mac_mini_m2
    environment:
      vars:
        PACKAGE_NAME: "com.dalton.braillekeyboard"
    triggering:
      events:
        - push
    scripts:
      - name: Build Android APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - "**/*.apk"
