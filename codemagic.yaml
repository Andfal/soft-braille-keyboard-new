workflows:
  android-apk-classic-build:
    name: Android APK Classic Build
    max_build_duration: 20
    instance_type: mac_mini_m2
    environment:
      vars:
        PACKAGE_NAME: "com.dalton.braillekeyboard"
    triggering:
      events:
        - push
    scripts:
      - name: Generate version properties
        script: |
          HIGH_VERSION=$(( 1000 + CM_BUILD_NUMBER ))
          echo "VERSION_CODE=${HIGH_VERSION}" > version.properties
          echo "VERSION_NAME=Obalamy 0.7" >> version.properties
      - name: Build Android APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - "**/*.apk"
